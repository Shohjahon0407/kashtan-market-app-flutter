name: iOS unsigned build

on:
  workflow_dispatch:
  pull_request:
    paths:
      - ".github/workflows/ios-build.yml"
      - "ios/**"
      - "lib/**"
      - "assets/**"
      - "pubspec.yaml"
      - "pubspec.lock"

permissions:
  contents: read

concurrency:
  group: ios-unsigned-${{ github.ref }}
  cancel-in-progress: true

jobs:
  ios-build:
    name: Build iOS (unsigned)
    runs-on: macos-26
    timeout-minutes: 45

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: "3.47.9"
          channel: stable
          cache: true

      - name: Verify toolchain
        run: |
          flutter --version
          xcodebuild -version

      - name: Get dependencies
        run: flutter pub get

      - name: Build iOS without signing
        run: flutter build ios --release --no-codesign

      - name: Archive unsigned app for inspection
        run: |
          test -d build/ios/iphoneos/Runner.app
          ditto -c -k --sequesterRsrc --keepParent build/ios/iphoneos/Runner.app kashtan-ios-unsigned.zip

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: kashtan-ios-unsigned
          path: kashtan-ios-unsigned.zip
          if-no-files-found: error
          retention-days: 7
